# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"
  api:
    errors:
      unauthorized: Unauthorized
      forbidden: Forbidden
      query_required: Query parameter q is required
      invalid_attachment: Invalid file type or size
      invalid_current_password: Current password is incorrect
      account_disabled: This account has been disabled
      cannot_disable_self: You cannot disable your own account
  ticket:
    statuses:
      open: Open
      in_progress: In progress
      pending: Pending
      resolved: Resolved
      closed: Closed
    priorities:
      low: Low
      medium: Medium
      high: High
      urgent: Urgent
  user:
    roles:
      customer: Customer
      admin: Admin
  mailers:
    ticket:
      ticket_created:
        subject: "[Helpdesk] New ticket #%{id}: %{title}"
      ticket_assigned:
        subject: "[Helpdesk] Assigned to ticket #%{id}: %{title}"
      comment_added:
        subject: "[Helpdesk] New comment on ticket #%{id}: %{title}"
      sla_reminder:
        subject: "[Helpdesk] SLA reminder for ticket #%{id}: %{title}"
